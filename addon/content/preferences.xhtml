<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window });"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <!-- Authentication Section -->
  <groupbox>
    <label><html:h3 data-l10n-id="pref-auth-status"></html:h3></label>
    <hbox align="center">
      <html:div id="__addonRef__-auth-status">Not authenticated</html:div>
      <html:button
        id="__addonRef__-auth-button"
        data-l10n-id="pref-auth-button-signin"
      ></html:button>
    </hbox>
  </groupbox>

  <!-- Sync Statistics Section -->
  <groupbox>
    <label><html:h3 data-l10n-id="pref-sync-stats"></html:h3></label>
    <html:div id="__addonRef__-sync-stats">
      <html:p>Total attachments: <html:span id="__addonRef__-total-attachments">-</html:span></html:p>
      <html:p>Synced to Google Drive: <html:span id="__addonRef__-synced-attachments">-</html:span></html:p>
      <html:p>Not synced: <html:span id="__addonRef__-unsynced-attachments">-</html:span></html:p>
    </html:div>
    <hbox>
      <html:button
        id="__addonRef__-sync-now"
        style="margin-right: 10px; padding: 8px 16px; font-weight: bold;"
      >🔄 Sync Now</html:button>
      <html:button
        id="__addonRef__-clear-sync"
        data-l10n-id="pref-clear-sync"
      ></html:button>
    </hbox>
  </groupbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
